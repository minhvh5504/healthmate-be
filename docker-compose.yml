version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: healthmate_postgres_v2
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthmate_user
      POSTGRES_PASSWORD: healthmate_password_2026
      POSTGRES_DB: healthmate_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - healthmate_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U healthmate_user -d healthmate_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # Additional Redis
  healthmate-redis:
    image: redis:7-alpine
    container_name: healthmate_redis_v2
    restart: unless-stopped
    ports:
      - '6382:6379'
    volumes:
      - healthmate_redis_data:/data
    networks:
      - healthmate_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthmate_backend_v2
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      healthmate-redis:
        condition: service_healthy
    networks:
      - healthmate_network
    command: >
      sh -c "
        echo '🔄 Waiting for database to be ready...' &&
        sleep 5 &&
        echo '🔄 Running database migrations...' &&
        npx prisma migrate deploy &&
        echo '🌱 Seeding database (if seed file exists)...' &&
        (npx prisma db seed || echo '⚠️  No seed file found, skipping...') &&
        echo '✅ Starting application...' &&
        node dist/src/main.js
      "

volumes:
  postgres_data:
    driver: local
  healthmate_redis_data:
    driver: local

networks:
  healthmate_network:
    driver: bridge
